version: '3.8'

services:
  homelab-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: homelab-dashboard:latest
    container_name: homelab-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - JWT_SECRET=replace_with_a_secure_random_jwt_secret_in_production
      # Optional: Auto-create initial admin credentials on fresh start
      # - INITIAL_ADMIN_USER=admin
      # - INITIAL_ADMIN_PASSWORD=admin
    volumes:
      # PERSISTENT STORAGE:
      # Named volume ensures data (database, custom icons, uploads, backups)
      # is NEVER deleted when updating, removing, or pulling new container images.
      - homelab_data:/app/data

      # Host Directory Bind Mount (Alternative):
      # If you prefer directly editing or accessing the data folder on your host machine,
      # comment out 'homelab_data:/app/data' above and uncomment the line below:
      # - ./data:/app/data

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/public/config"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  # Persistent volume declaration
  homelab_data:
    driver: local

