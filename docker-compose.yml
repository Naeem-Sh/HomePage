services:
  portal-shiraz:
    build:
      context: .
      dockerfile: Dockerfile
    image: portal-shiraz:latest
    container_name: portal_shiraz_app
    restart: unless-stopped
    ports:
      - "4500:4500"
    environment:
      NODE_ENV: production
      PORT: 4500
      JWT_SECRET: shiraz_portal_jwt_secret_token_2026
      INITIAL_ADMIN_USER: admin
      INITIAL_ADMIN_PASSWORD: "123"
      RESET_ADMIN_PASSWORD: "false"
      DATA_DIR: /app/data
    volumes:
      # دایرکتوری داده‌های خارج از کانتینر برای ماندگاری اطلاعات، آپلودها و پشتیبان‌ها
      - ./portal_shiraz_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4500/api/public/config || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
