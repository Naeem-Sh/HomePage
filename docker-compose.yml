services:
  linxdash:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linxdash
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=change_this_to_a_secure_random_string_in_production
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/public/config"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
