services:
  homelab-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: homelab-dashboard:latest
    container_name: homelab-dashboard
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - JWT_SECRET=${JWT_SECRET:-please_replace_this_with_a_secure_random_secret_string_32_chars}
      - INITIAL_ADMIN_USER=${INITIAL_ADMIN_USER:-admin}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-123}
      - RESET_ADMIN_PASSWORD=${RESET_ADMIN_PASSWORD:-false}
    volumes:
      # =========================================================================
      # PERSISTENT STORAGE / ذخیره‌سازی داده‌های دائمی
      # =========================================================================
      # روش اول (پیشنهادی): ذخیره در پوشه میزبان (Host Bind Mount)
      # داده‌ها در پوشه data کنار همین فایل ذخیره می‌شوند و با هیچ دستوری حذف نمی‌گردند.
      - ./data:/app/data

      # یا اگر می‌خواهید در مسیر سیستم‌عامل سرور ذخیره شود:
      # - /opt/homelab-data:/app/data

      # روش دوم: استفاده از والیوم نام‌گذاری‌شده داکر
      # - homelab_data:/app/data

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# در صورت استفاده از روش دوم (والیوم داکر)، خطوط زیر را فعال کنید:
# volumes:
#   homelab_data:
#     driver: local


